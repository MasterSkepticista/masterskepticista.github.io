<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Diagrammatic backpropagation triangle</title>
  <desc id="desc">Evidence maps through Syndrome to Diagnosis, and also maps directly to Diagnosis.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
    <style>
      .node { fill: #fff; stroke: #222; stroke-width: 2.5; rx: 12; }
      .main { font: 22px Georgia, serif; fill: #222; text-anchor: middle; }
      .small { font: italic 20px Georgia, serif; fill: #444; text-anchor: middle; }
      .arrow { fill: none; stroke: #222; stroke-width: 2.5; marker-end: url(#arrow); }
      .direct { fill: none; stroke: #b31b34; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="node" x="45" y="215" width="190" height="76"/><text class="main" x="140" y="261">Evidence (E)</text>
  <rect class="node" x="315" y="70" width="190" height="76"/><text class="main" x="410" y="116">Syndrome (S)</text>
  <rect class="node" x="585" y="215" width="190" height="76"/><text class="main" x="680" y="261">Diagnosis (D)</text>
  <path class="arrow" d="M217 216 L333 153"/><text class="small" x="260" y="173">f</text>
  <path class="arrow" d="M487 153 L603 216"/><text class="small" x="559" y="173">g</text>
  <path class="direct" d="M236 253 H575"/><text class="small" x="405" y="241">h</text>
  <text class="small" x="410" y="329">h(x) ≈ g(f(x))</text>
</svg>
